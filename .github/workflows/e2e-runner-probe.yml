name: e2e-runner-probe

# Phase 0 of "e2e onto a self-hosted runner". READ-ONLY CAPABILITY PROBE — this
# workflow installs nothing, builds nothing and runs no tests. It answers the one
# question the GitHub API cannot: what is actually on `runner-vm-1`?
#
# The REST API exposes only id/name/os/status/busy/labels/version for a runner, so
# the toolchain (node, pnpm, g++, python3, xvfb, the Electron shared libs), the disk
# headroom and whether the runner is itself a container are all unknowable from
# outside. Everything here is introspection, and its OUTPUT is the provisioning list
# for Phase 1.
#
# Every line is written with `| tee -a "$GITHUB_STEP_SUMMARY"` rather than a plain
# `>>` redirect, so the report lands in BOTH the rendered run summary and the job
# log. That matters because $GITHUB_STEP_SUMMARY is a SEPARATE FILE PER STEP — a
# trailing `cat "$GITHUB_STEP_SUMMARY"` step reads its own empty file, not the
# accumulated report (learned the hard way on run 31221059524) — and because the
# REST API exposes no summary field at all, so the log is the only CLI-readable
# channel. Phase 2's e2e results will need reading the same way.
#
# Deliberately `workflow_dispatch`-only: no push/pull_request trigger, so this can
# never be reached by a contributor's branch and costs nothing until someone asks
# for it. The repo went private on 2026-08-08 specifically so a self-hosted runner
# is safe to target at all — do not add a `pull_request` (or, ever,
# `pull_request_target`) trigger to any job that runs on this label.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe self-hosted runner
    runs-on: [self-hosted, canvas-ade]
    timeout-minutes: 15
    steps:
      # Runs BEFORE checkout on purpose: if `actions/checkout` fails on this box we
      # still want the machine report. Every command is `|| true`-guarded so a
      # missing tool records "absent" instead of aborting the probe — absence is the
      # finding, not an error.
      - name: Machine report
        run: |
          echo "## Machine" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "runner name : ${RUNNER_NAME:-?}"
            echo "runner os   : ${RUNNER_OS:-?} / ${RUNNER_ARCH:-?}"
            echo "workspace   : ${GITHUB_WORKSPACE:-?}"
            echo "runner temp : ${RUNNER_TEMP:-?}"
            echo "whoami      : $(whoami 2>/dev/null || echo '?')"
            echo "kernel      : $(uname -a 2>/dev/null || echo '?')"
            echo "distro      : $( (. /etc/os-release && echo "$PRETTY_NAME") 2>/dev/null || echo '?')"
            echo "nproc       : $(nproc 2>/dev/null || echo '?')"
            echo "memory      : $(free -h 2>/dev/null | awk 'NR==2{print $2" total, "$7" available"}' || echo '?')"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"

      # Is the runner itself a container? Decides whether `pnpm test:e2e:linux`
      # (which shells out to `docker build`/`docker run`) is even possible here, and
      # whether /dev/shm is the 64MB default that makes --disable-dev-shm-usage
      # load-bearing (e2e/fixtures.ts applies it on CI+linux already).
      - name: Containerization
        run: |
          echo "## Containerization" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          {
            if [ -f /.dockerenv ]; then echo "/.dockerenv  : PRESENT (containerized)"; else echo "/.dockerenv  : absent"; fi
            echo "cgroup       : $(cat /proc/1/cgroup 2>/dev/null | head -3 || echo '?')"
            echo "pid1         : $(cat /proc/1/comm 2>/dev/null || echo '?')"
            echo "/dev/shm     : $(df -h /dev/shm 2>/dev/null | awk 'NR==2{print $2}' || echo '?')"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"

      # The e2e suite historically orphaned ~0.7GB per GREEN run (Playwright cleanup
      # racing worker exit). A small VPS disk fills fast, so the free-space number
      # here sets the Phase 2 preflight floor.
      - name: Disk
        run: |
          echo "## Disk" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          df -h 2>/dev/null | head -20 | tee -a "$GITHUB_STEP_SUMMARY" || echo '?' | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"

      # node-pty SOURCE-compiles against the Electron ABI in postinstall
      # (electron-builder install-app-deps), which is why Dockerfile.e2e is built on
      # node:22-bookworm / buildpack-deps. Missing g++/make/python3 here means
      # `pnpm install` cannot succeed, and that is a Phase 1 provisioning item.
      - name: Toolchain
        run: |
          # `eval`, not `{ $2; }` — the probes contain pipes (`gcc --version | head -1`)
          # and an unquoted expansion would word-split the `|` into a literal argument.
          # `pipefail` inside the subshell is load-bearing: without it a missing tool
          # still exits 0 (the trailing `head` succeeds on empty input) and the entry
          # prints BLANK instead of ABSENT — which is the one answer this probe exists
          # to give unambiguously.
          v() { printf '%-12s: %s\n' "$1" "$(set -o pipefail; eval "$2" 2>/dev/null || echo 'ABSENT')"; }
          echo "## Toolchain" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          {
            v node     'node --version'
            v pnpm     'pnpm --version'
            v corepack 'corepack --version'
            v npm      'npm --version'
            v git      'git --version'
            v python3  'python3 --version'
            v gcc      'gcc --version | head -1'
            v g++      'g++ --version | head -1'
            v make     'make --version | head -1'
            v docker   'docker --version'
            v xvfb-run 'command -v xvfb-run'
            v Xvfb     'command -v Xvfb'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"

      # Can this box talk to the Docker daemon, or only to the client binary? The
      # local matrix runs the Linux leg as a container; if the daemon is unreachable
      # the CI Linux leg must run Electron bare-metal under Xvfb instead.
      - name: Docker daemon reachability
        run: |
          echo "## Docker daemon" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          if docker info >/dev/null 2>&1; then
            echo "docker info : OK (daemon reachable)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "docker info : UNREACHABLE — the Linux leg must run bare-metal under Xvfb" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"

      # The exact library set Dockerfile.e2e installs. Any MISSING entry is a
      # provisioning item; without them Electron aborts or hangs at launch rather
      # than failing a test, which reads as an infra fault, not a red suite.
      - name: Electron shared libs
        run: |
          libs="libnss3 libnspr4 libatk-1.0 libatk-bridge-2.0 libcups libdrm \
                libxkbcommon libxcomposite libxdamage libxfixes libXrandr libgbm \
                libasound libpango-1.0 libcairo libatspi libgtk-3"
          echo "## Electron shared libs" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          missing=0
          for l in $libs; do
            if ldconfig -p 2>/dev/null | grep -q -- "$l\.so"; then
              printf '%-22s: present\n' "$l" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              printf '%-22s: MISSING\n' "$l" | tee -a "$GITHUB_STEP_SUMMARY"
              missing=$((missing + 1))
            fi
          done
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "**$missing missing**" | tee -a "$GITHUB_STEP_SUMMARY"

      # A poisoned environment is a documented failure class: CANVAS_RECAP_BOARD
      # aborts the unit gate, GIT_DIR/GIT_WORK_TREE made boardGitDiff report the HOST
      # repo's diff, E2E_KEEP_TMP defeats the temp sweep, and any *_API_KEY on the box
      # is a secret-surface finding. Phase 2 will assert these FAIL-CLOSED; the probe
      # only reports, so we learn the truth before a gate starts rejecting jobs.
      - name: Inherited environment (report only)
        run: |
          vars="CANVAS_RECAP_BOARD CANVAS_DEV_PROJECT CANVAS_ALLOW_SCHEMA_RAISE \
                CANVAS_FRESH CANVAS_SMOKE CANVAS_SHOT CANVAS_UPDATE_FEED \
                CANVAS_USERDATA CANVAS_VOICE_SPIKE CANVAS_LLM_MOCK CANVAS_E2E \
                CLAUDE_CONFIG_DIR CLAUDECODE CLAUDE_CODE_SESSION_ID \
                GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_COMMON_DIR \
                E2E_WORKERS E2E_KEEP_TMP E2E_VIDEO E2E_FULL_MATRIX E2E_PRECOMMIT \
                ANTHROPIC_API_KEY OPENAI_API_KEY GITHUB_TOKEN AWS_SECRET_ACCESS_KEY"
          echo "## Inherited environment" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          found=0
          for v in $vars; do
            # Report presence only — never the value; several of these are secrets.
            if [ -n "${!v}" ]; then
              printf '%-26s: SET\n' "$v" | tee -a "$GITHUB_STEP_SUMMARY"
              found=$((found + 1))
            fi
          done
          # if/fi, not `[ … ] && echo` — the runner shell is `bash -e`, so a false
          # test as a bare command would abort the step instead of skipping the echo.
          if [ "$found" -eq 0 ]; then
            echo "clean — none of the poison vars are set" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "TMPDIR=${TMPDIR:-<unset, defaults to /tmp>}" | tee -a "$GITHUB_STEP_SUMMARY"

      # Last, because it is the only step that touches the repo. If checkout fails
      # the report above still lands. `fetch-depth: 1` — the probe needs no history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Checkout sanity
        run: |
          echo "## Checkout" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "sha        : ${GITHUB_SHA:0:12}"
            echo "files      : $(ls -1 | wc -l) entries at the repo root"
            echo "manifest   : $(node -p "require('./package.json').version" 2>/dev/null || echo 'node could not read package.json')"
            echo "workspace  : $(du -sh . 2>/dev/null | cut -f1 || echo '?')"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "_Probe complete — nothing was installed, built or executed from the repo._" | tee -a "$GITHUB_STEP_SUMMARY"
